[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jonarai"
version = "0.1.0"
description = "JONARAI — SPX/SPXW 0DTE options trading intelligence. Selectivity-first; TIME as P0. Confidence score, not probability."
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "PROPRIETARY — not yet licensed" }
authors = [{ name = "fas988840-dev" }]
keywords = ["options", "trading", "intelligence", "SPX", "SPXW", "0DTE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Runtime dependencies. Pinned to sane recent versions; upgraded on the
# architect's request only for anything that could change trading behavior.
dependencies = [
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.35,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.14.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.28.0,<0.29.0",             # for provider REST calls
    "websockets>=13.1,<14.0",             # for provider WS ingestion
    "orjson>=3.10.7,<4.0.0",              # fast JSON
    "structlog>=24.4.0,<25.0.0",          # structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "hypothesis>=6.115.0,<7.0.0",         # property-based tests for deterministic engines
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "types-python-dateutil",
]

[project.scripts]
# Placeholder — the actual entry point lands in Phase D.
# jonarai-api = "jonarai.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jonarai"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Broad-strokes ruleset. If the architect prefers narrower, we narrow.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # Assert used — pytest needs it
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/jonarai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0  # will rise as real code lands (Phase F+)
