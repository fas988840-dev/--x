# Local-development-only Docker Compose.
#
# Boots a Postgres 16 instance with TimescaleDB pre-installed so the
# backend's Alembic migrations (once they exist, Phase E) have a real
# hypertable-capable database to run against.
#
# This is NOT a production topology. Production deployment is a Phase Z
# decision — see docs/JONARAI_BUILD_ROADMAP.md.

name: jonarai-dev

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: jonarai-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jonarai
      POSTGRES_PASSWORD: jonarai_dev_only
      POSTGRES_DB: jonarai
      # TimescaleDB's own tuning script — safe defaults for dev.
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - jonarai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jonarai -d jonarai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  jonarai_pg_data:
    name: jonarai_pg_data
