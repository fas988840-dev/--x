# Fly.io configuration for FactLedger API
app = "factledger-api"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
CORS_ORIGIN = "*"
PORT = "8080"
NODE_ENV = "production"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1

[[services]]
protocol = "tcp"
internal_port = 8080
processes = ["app"]

[services.concurrency]
type = "connections"
hard_limit = 1000
soft_limit = 500

[[statics]]
guest_path = "/docs"
url_path = "/docs"
