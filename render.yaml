services:
  - type: web
    name: factledger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main

    envVars:
      - key: NODE_ENV
        value: production
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      # Set these in the Render dashboard → Environment:
      # CORS_ORIGIN   — e.g. https://your-dashboard.vercel.app
      # API_KEYS      — comma-separated API keys
      # CHAINGPT_API_KEY — optional, for live explanations

    healthCheckPath: /api/v1/health
