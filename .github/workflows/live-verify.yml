name: Live Verification

# Runs automatically after a successful deploy to Fly.io/Render,
# or manually via workflow_dispatch with the deployed URL.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   FACTLEDGER_API_URL   — e.g. https://factledger-api.fly.dev
#   FACTLEDGER_API_KEY   — optional; leave empty if API_KEYS not set on the server
#   SOLANA_RPC_URL       — optional; defaults to public mainnet-beta endpoint
#
# The job does NOT require CHAINGPT_API_KEY — it only checks the /explanation
# endpoint's fallback path (deterministic summary) to avoid spending credits.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Deployed API base URL (overrides FACTLEDGER_API_URL secret)'
        required: false
        type: string
  workflow_run:
    workflows: ['Deploy to Fly.io', 'Deploy to Render']
    types: [completed]

jobs:
  live-verify:
    name: Live smoke tests
    runs-on: ubuntu-latest
    # On workflow_run trigger, only run if the deploy succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      API_URL: ${{ inputs.api_url || secrets.FACTLEDGER_API_URL }}
      API_KEY: ${{ secrets.FACTLEDGER_API_KEY }}
      SOLANA_RPC:  ${{ secrets.SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
      # Use a well-known read-only address: Solana System Program
      TEST_WALLET: '11111111111111111111111111111112'

    steps:
      - name: Verify API_URL is set
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::FACTLEDGER_API_URL secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          echo "Testing against: $API_URL"

      # ── 1. Health check ────────────────────────────────────────────────────
      - name: Health check
        run: |
          STATUS=$(curl -sf --max-time 10 \
            -o /tmp/health.json \
            -w "%{http_code}" \
            "$API_URL/api/v1/health")
          echo "HTTP $STATUS"
          cat /tmp/health.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check returned $STATUS"
            exit 1
          fi
          echo "✅ /api/v1/health → 200"

      # ── 2. Wallet intelligence ─────────────────────────────────────────────
      - name: Wallet intelligence (System Program)
        run: |
          STATUS=$(curl -sf --max-time 30 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/intel.json \
            -w "%{http_code}" \
            "$API_URL/api/v1/wallet/$TEST_WALLET/intelligence")
          echo "HTTP $STATUS"
          cat /tmp/intel.json | python3 -m json.tool --no-ensure-ascii 2>/dev/null || cat /tmp/intel.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Wallet intelligence returned $STATUS"
            exit 1
          fi
          # Verify score is a number in [0,100]
          SCORE=$(cat /tmp/intel.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['score'])")
          echo "Intelligence score: $SCORE"
          python3 -c "
          s = float('$SCORE')
          assert 0 <= s <= 100, f'Score {s} out of [0,100]'
          print('✅ score in range')
          "

      # ── 3. Risk assessment ─────────────────────────────────────────────────
      - name: Risk assessment (System Program)
        run: |
          STATUS=$(curl -sf --max-time 30 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/risk.json \
            -w "%{http_code}" \
            "$API_URL/api/v1/wallet/$TEST_WALLET/risk")
          echo "HTTP $STATUS"
          cat /tmp/risk.json | python3 -m json.tool --no-ensure-ascii 2>/dev/null || cat /tmp/risk.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Risk assessment returned $STATUS"
            exit 1
          fi
          LEVEL=$(cat /tmp/risk.json | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['level'])")
          echo "Risk level: $LEVEL"
          python3 -c "
          assert '$LEVEL' in ('low','medium','high'), f'Unexpected level: $LEVEL'
          print('✅ risk level valid')
          "

      # ── 4. Explanation endpoint (deterministic fallback, no ChainGPT key) ─
      - name: Explanation endpoint (deterministic fallback)
        run: |
          STATUS=$(curl -sf --max-time 30 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/explanation.json \
            -w "%{http_code}" \
            "$API_URL/api/v1/wallet/$TEST_WALLET/explanation")
          echo "HTTP $STATUS"
          cat /tmp/explanation.json | python3 -m json.tool --no-ensure-ascii 2>/dev/null || cat /tmp/explanation.json
          if [ "$STATUS" != "200" ]; then
            echo "::error::Explanation returned $STATUS"
            exit 1
          fi
          SOURCE=$(cat /tmp/explanation.json | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['data']['summarySource'])" 2>/dev/null || echo "unknown")
          echo "Summary source: $SOURCE"
          echo "✅ /explanation reachable — summarySource=$SOURCE"

      # ── 5. Validation rejects bad address → 400 ───────────────────────────
      - name: 400 on invalid address
        run: |
          STATUS=$(curl -s --max-time 10 \
            -H "${API_KEY:+X-API-Key: $API_KEY}" \
            -o /tmp/bad.json \
            -w "%{http_code}" \
            "$API_URL/api/v1/wallet/not-a-wallet/intelligence")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "::error::Expected 400 for invalid address, got $STATUS"
            exit 1
          fi
          echo "✅ invalid address → 400"

      # ── 6. Solana RPC connectivity ─────────────────────────────────────────
      - name: Solana mainnet-beta RPC reachability
        run: |
          RESPONSE=$(curl -sf --max-time 10 \
            -X POST "$SOLANA_RPC" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"getSlot","params":[]}')
          echo "RPC response: $RESPONSE"
          SLOT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
          echo "Current slot: $SLOT"
          python3 -c "
          assert int('$SLOT') > 0, 'Slot must be positive'
          print('✅ Solana RPC reachable — slot=$SLOT')
          "

      # ── 7. Summary ────────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "  Live Verification Summary"
          echo "  API: $API_URL"
          echo "  Wallet: $TEST_WALLET"
          echo "═══════════════════════════════════════"
          for f in health intel risk explanation bad; do
            if [ -f /tmp/$f.json ]; then
              echo "[$f] ✅"
            else
              echo "[$f] ❌ (not reached)"
            fi
          done
