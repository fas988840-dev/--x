name: Deploy Dashboard to Vercel

# Deploys dashboard/ to Vercel on every push to main that touches dashboard/
# or this workflow file itself, so deployment workflow fixes are exercised immediately.
#
# GitHub Secret used for automatic deployment:
#   VERCEL_TOKEN — from vercel.com/account/tokens
# If it is unset, the workflow reports a notice and exits successfully.
#
# The workflow discovers the Vercel project from its GitHub link or a known
# FactLedger dashboard name. It never falls back to an arbitrary first project.
# Optional: VERCEL_PROJECT_NAME can force an exact project-name match.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions: {}

jobs:
  deploy-dashboard:
    name: Deploy dashboard to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Check VERCEL_TOKEN
        id: vercel_auth
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set; skipping automatic Vercel deployment."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover Vercel project
        if: steps.vercel_auth.outputs.available == 'true'
        id: vercel_ids
        env:
          VERCEL_PROJECT_NAME: ${{ secrets.VERCEL_PROJECT_NAME }}
        run: |
          PROJECTS_RESP=$(curl -sf --max-time 20 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects?limit=100") || {
              echo "::error::Could not authenticate with Vercel or list projects."
              exit 1
            }

          MATCH=$(printf '%s' "$PROJECTS_RESP" | python3 -c '
          import json, os, sys

          data = json.load(sys.stdin)
          projects = data.get("projects", [])
          override = os.environ.get("VERCEL_PROJECT_NAME", "").strip().lower()

          def repo_name(project):
              link = project.get("link") or {}
              return str(link.get("repo") or link.get("repoName") or "").strip().lower()

          if override:
              candidates = [p for p in projects if str(p.get("name", "")).lower() == override]
          else:
              repo_candidates = []
              for p in projects:
                  repo = repo_name(p)
                  if repo in {"--x", "fas988840-dev/--x"} or repo.endswith("/--x"):
                      repo_candidates.append(p)
              if repo_candidates:
                  candidates = repo_candidates
              else:
                  known = {"factledger", "factledger-dashboard", "dashboard"}
                  candidates = [p for p in projects if str(p.get("name", "")).lower() in known]

          if len(candidates) != 1:
              print("")
              sys.exit(0)

          project = candidates[0]
          project_id = str(project.get("id") or "")
          account_id = str(project.get("accountId") or "")
          if not project_id or not account_id:
              print("")
              sys.exit(0)

          print(project_id + "\t" + account_id)
          ')

          if [ -z "$MATCH" ]; then
            echo "::error::Could not uniquely identify the FactLedger Vercel project."
            echo "Link the Vercel project to fas988840-dev/--x or set repository secret VERCEL_PROJECT_NAME to its exact name."
            exit 1
          fi

          IFS=$'\t' read -r PROJECT_ID ORG_ID <<< "$MATCH"
          if [ -z "$PROJECT_ID" ] || [ -z "$ORG_ID" ]; then
            echo "::error::Vercel project metadata is incomplete."
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "Selected Vercel project: $PROJECT_ID"

      - name: Install Vercel CLI
        if: steps.vercel_auth.outputs.available == 'true'
        run: npm install -g vercel@59.11.2 --no-audit --no-fund

      - name: Install dashboard dependencies
        if: steps.vercel_auth.outputs.available == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: dashboard

      - name: Link Vercel project
        if: steps.vercel_auth.outputs.available == 'true'
        working-directory: dashboard
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "projectId": "${{ steps.vercel_ids.outputs.project_id }}",
            "orgId": "${{ steps.vercel_ids.outputs.org_id }}"
          }
          EOF

      - name: Pull Vercel environment
        if: steps.vercel_auth.outputs.available == 'true'
        run: vercel pull --yes --environment=production
        working-directory: dashboard
        env:
          VERCEL_ORG_ID: ${{ steps.vercel_ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel_ids.outputs.project_id }}

      - name: Build dashboard
        if: steps.vercel_auth.outputs.available == 'true'
        run: vercel build --prod
        working-directory: dashboard
        env:
          VERCEL_ORG_ID: ${{ steps.vercel_ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel_ids.outputs.project_id }}

      - name: Deploy to Vercel
        if: steps.vercel_auth.outputs.available == 'true'
        id: deploy
        working-directory: dashboard
        env:
          VERCEL_ORG_ID: ${{ steps.vercel_ids.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.vercel_ids.outputs.project_id }}
        run: |
          URL=$(vercel deploy --prebuilt --prod)
          if [ -z "$URL" ]; then
            echo "::error::Vercel did not return a deployment URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Smoke test dashboard
        if: steps.vercel_auth.outputs.available == 'true'
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          sleep 5
          STATUS=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Dashboard HTTP $STATUS at $URL"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Dashboard smoke test failed with HTTP $STATUS."
            exit 1
          fi
