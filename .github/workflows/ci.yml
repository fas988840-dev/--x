name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: 'npm'` here on purpose: that option hashes
          # package-lock.json for the cache key, and this repo has no
          # committed lockfile (npm install has only ever been runnable
          # from the sandboxes that wrote this code, which had the npm
          # registry blocked - see CLAUDE.md/README.md's verification-
          # status notes throughout). Without a lockfile, setup-node@v4
          # fails outright before `npm install` even runs, which is why
          # every prior run on this branch shows failure/startup_failure
          # with every later step skipped. `npm install` below still
          # works fine without a cache; it's just not cached across runs.

      - run: npm install

      - name: Audit dependencies (high/critical only)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test (includes the determinism check below)
        run: npm test

      - name: Build
        run: npm run build
