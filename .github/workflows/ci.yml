name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  test:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Audit dependencies (full JSON, non-blocking)
        # Capture exact advisory chains and severities without applying forced
        # dependency changes. This remains non-blocking so verification still
        # runs even when npm reports advisories.
        run: timeout 120s npm audit --json || true

      - name: Audit production dependencies (non-blocking)
        # Separates runtime exposure from dev-tool advisories such as Vitest/Vite.
        run: timeout 120s npm audit --omit=dev --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        env:
          FACTLEDGER_API_URL: http://127.0.0.1:3001
          FACTLEDGER_API_KEY: ci-placeholder-only
        run: npm run build
