name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  test:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Audit dependencies (full JSON, non-blocking)
        # Capture exact advisory chains and severities without applying forced
        # dependency changes. This remains non-blocking so verification still
        # runs even when npm reports advisories.
        run: npm audit --json || true

      - name: Audit production dependencies (non-blocking)
        # Separates runtime exposure from dev-tool advisories such as Vitest/Vite.
        run: npm audit --omit=dev --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Build dashboard
        env:
          FACTLEDGER_API_URL: http://127.0.0.1:3001
          FACTLEDGER_API_KEY: ci-placeholder-only
        run: npm run build
