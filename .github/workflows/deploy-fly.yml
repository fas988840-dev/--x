name: Deploy to Fly.io

# Deploys the API (src/ → Dockerfile → Fly.io).
#
# This workflow is MANUAL-ONLY (workflow_dispatch) — it does not auto-trigger
# on push. The primary auto-deploy path is deploy-render.yml (Render.com),
# which requires only a browser to set up.
#
# To use this workflow, first set FLY_API_TOKEN in GitHub Secrets:
#   flyctl tokens create deploy   (run once from a machine with the CLI)
#   Then: Settings → Secrets → Actions → New secret → FLY_API_TOKEN
#
# fly.toml is in the repo root — no `flyctl launch` needed.

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Check FLY_API_TOKEN
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set."
            echo "Run: flyctl tokens create deploy"
            echo "Then: Settings → Secrets → Actions → New secret → FLY_API_TOKEN"
            echo ""
            echo "Tip: Use deploy-render.yml instead — it only needs render.com browser setup."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify health after deploy
        run: |
          APP=$(flyctl info --json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('Hostname',''))" 2>/dev/null || echo "")
          if [ -n "$APP" ]; then
            sleep 5
            curl -sf --max-time 15 "https://$APP/api/v1/health" && echo "✅ Post-deploy health check passed"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        continue-on-error: true
