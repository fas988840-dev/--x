name: Deploy to Render

# Deploys the API (src/ → Dockerfile → Render.com) on every push to main.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   RENDER_API_KEY    — from render.com/u/settings → API Keys → Create API Key
#   RENDER_SERVICE_ID — from render.com dashboard → your service → Settings → top of page
#
# Render service environment must also include API_KEYS and CORS_ORIGIN.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'render.yaml'
      - 'package*.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy API to Render
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.RENDER_API_KEY }}" ]    && MISSING="$MISSING RENDER_API_KEY"
          [ -z "${{ secrets.RENDER_SERVICE_ID }}" ] && MISSING="$MISSING RENDER_SERVICE_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing secrets:$MISSING"
            echo "Add them as GitHub Repository secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Trigger Render deploy
        id: deploy
        run: |
          RESPONSE=$(curl -sf --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys")
          echo "Deploy triggered."
          DEPLOY_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render did not return a deploy ID."
            exit 1
          fi
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to complete
        run: |
          echo "Waiting for Render deploy to finish..."
          LIVE=0
          for i in $(seq 1 20); do
            STATUS=$(curl -sf --max-time 10 \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys/${{ steps.deploy.outputs.deploy_id }}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "[$i/20] Deploy status: $STATUS"
            case "$STATUS" in
              live)
                LIVE=1
                break
                ;;
              deactivated|build_failed|update_failed|canceled)
                echo "::error::Deploy failed with status: $STATUS"
                exit 1
                ;;
            esac
            sleep 15
          done
          if [ "$LIVE" -ne 1 ]; then
            echo "::error::Render deploy did not reach live state before timeout."
            exit 1
          fi

      - name: Health check
        run: |
          SVC=$(curl -sf --max-time 10 \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}")
          URL=$(echo "$SVC" | python3 -c "import sys,json; print(json.load(sys.stdin).get('serviceDetails',{}).get('url',''))")
          if [ -z "$URL" ]; then
            echo "::error::Could not resolve Render service URL."
            exit 1
          fi
          sleep 5
          STATUS=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "$URL/api/v1/health" || echo "000")
          echo "Health check HTTP $STATUS at $URL/api/v1/health"
          if [ "$STATUS" != "200" ]; then
            echo "::error::API health check failed with HTTP $STATUS."
            exit 1
          fi
